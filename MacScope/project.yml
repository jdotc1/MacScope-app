name: MacScope
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "27.0"
configFiles:
  Debug: DependencyRoots.xcconfig
  Release: DependencyRoots.xcconfig
packages:
  RecoveryKit:
    path: ../Packages/RecoveryKit
  Lumen:
    path: ../ThirdParty/Lumen
  MachOKit:
    path: ../ThirdParty/MachOKit/materialization/MachOKit
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SUPPORTED_PLATFORMS: macosx
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    AD_HOC_CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGN_STYLE: Manual
    # Keep one certificate-backed designated requirement across rebuilds so macOS
    # TCC approvals (App Management, Full Disk Access, Accessibility, Developer
    # Tools) can remain associated with the app as its code changes. Ad-hoc signing
    # falls back to a cdhash requirement that changes on every build.
    DEVELOPMENT_TEAM: "$(MACSCOPE_SIGNING_TEAM)"
    CODE_SIGN_IDENTITY: "$(MACSCOPE_SIGNING_IDENTITY)"
    PROVISIONING_PROFILE: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: ""
    # The Ghostty producer roots, MACSCOPE_SLEIGH_SOURCE_BUILD_ROOT, and the
    # strict MACSCOPE_SLEIGH_MATERIALIZATION_ROOT are supplied by
    # DependencyRoots.xcconfig (see configFiles below), NOT here. A
    # value set in this block lands in the generated pbxproj and outranks the
    # xcconfig, which would silently re-empty both settings for every Xcode-driven
    # build. Both remain overridable from the xcodebuild command line as before.
    # Live XPC supervision controls are compiled only by the explicit signed
    # qualification harness. Ordinary Debug and Release builds leave this empty.
    MACSCOPE_NATIVE_DECOMPILER_LIVE_TEST_CONDITION: ""
    # Routine Debug preserves embedded runtime attestation without repeatedly
    # qualifying the entire source closure. Qualification opts into source identity.
    MACSCOPE_DEBUG_SOURCE_IDENTITY: runtime-only
    # Shared target-intermediate location for the service's verified PIC
    # archive. It remains outside every product and source directory.
    MACSCOPE_NATIVE_DECOMPILER_BUILD_ROOT: "$(PROJECT_TEMP_DIR)/NativeDecompilerBridge"
    # Dedicated Xcode-owned scratch/output root for the tracked cross-language
    # native bridge golden gate. It must remain distinct from both immutable
    # package inputs and the native archive build root.
    MACSCOPE_NATIVE_DECOMPILER_GOLDEN_BUILD_ROOT: "$(PROJECT_TEMP_DIR)/NativeDecompilerBridgeGolden"
    # A typed Release admission supplies lists for its actual outputs.
    MACSCOPE_NATIVE_BRIDGE_INPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerBridgeInputs.xcfilelist"
    MACSCOPE_NATIVE_BRIDGE_OUTPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerBridgeOutputs.xcfilelist"
    MACSCOPE_NATIVE_PACKAGE_INPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerPackageInputs.xcfilelist"
    MACSCOPE_NATIVE_PACKAGE_OUTPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerPackageOutputs.xcfilelist"
    MACSCOPE_NATIVE_GOLDEN_INPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerBridgeGoldenInputs.xcfilelist"
    MACSCOPE_NATIVE_GOLDEN_OUTPUT_FILE_LIST: "$(SRCROOT)/../Scripts/native-decompiler-xpc/NativeDecompilerBridgeGoldenOutputs.xcfilelist"
    # RX-03 parser engines (LIEF, pe-parse, go-macho + MacScope C bridge). The worker's
    # pre-build phase stages the cached, prebuilt static archives here; no engine source is
    # compiled by Xcode. Shared by AnalysisWorkerXPCService and CoreTests.
    MACSCOPE_PARSER_ENGINES_ROOT: "$(PROJECT_TEMP_DIR)/MacScopeParserEngines"
    MACSCOPE_PARSER_ENGINES_LDFLAGS: '"$(MACSCOPE_PARSER_ENGINES_ROOT)/parser-engine-bridge/lib/libmacscope_parser_engines.a" "$(MACSCOPE_PARSER_ENGINES_ROOT)/parser-engine-lief/lib/libLIEF.a" "$(MACSCOPE_PARSER_ENGINES_ROOT)/parser-engine-pe-parse/lib/libpe-parse.a" "$(MACSCOPE_PARSER_ENGINES_ROOT)/parser-engine-go-macho/lib/libmacscope_gomacho.a" -lc++ -lresolv -framework CoreFoundation -framework Security'
    MACSCOPE_PARSER_ENGINES_INCLUDE: '"$(MACSCOPE_PARSER_ENGINES_ROOT)/parser-engine-bridge/include"'
  configs:
    Debug:
      CODE_SIGN_ENTITLEMENTS: ""
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      # Xcode's generated-project default currently resolves to -O for these
      # targets. Keep routine edit/build cycles unoptimized and reserve
      # optimization for the explicitly tuned Release configuration below.
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      # Routine edit/build cycles skip linker dead-stripping: it costs link
      # time on every relink and is not needed to run or debug locally.
      # Release keeps stripping. Debug already resolved dwarf (no dSYM) for
      # every target; pin it so a preset change cannot add dSYM generation.
      DEAD_CODE_STRIPPING: NO
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      # The installed app is a local-development qualification artifact, not a
      # distribution build. Keep the stable Apple Development identity and
      # hardened runtime, but inject the standard development entitlement so
      # Xcode LLDB/debugserver can prove installed-app launch/attach contracts.
      CODE_SIGN_ENTITLEMENTS: ""
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      # Xcode 27 enables coverage for this scheme by default, including plain
      # Release builds. Keep instrumentation confined to the Debug test action.
      ENABLE_CODE_COVERAGE: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEAD_CODE_STRIPPING: YES
      # Measured on the M1 Max with a fresh external DerivedData root: the
      # 463-file MacScope module fell from 629.25 s to 358.92 s wall time when
      # optimized per file, because WMO spent minutes on a single frontend
      # critical path before exposing parallel code generation.
      SWIFT_COMPILATION_MODE: singlefile
targets:
  MacScopeTestSupport:
    type: library.static
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/TestSupport/PlatformXCTestCase.swift
    settings:
      base:
        PRODUCT_NAME: MacScopeTestSupport
        PRODUCT_MODULE_NAME: MacScopeTestSupport
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app.MacScopeTestSupport
        SKIP_INSTALL: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
  SwiftAssemblyVendor:
    type: library.static
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: ../ThirdParty/SwiftAssemblyVendor/Sources
    settings:
      base:
        PRODUCT_NAME: SwiftAssemblyVendor
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app.SwiftAssemblyVendor
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
