  # Developer-only DCP-04 native-provider host. The source list is closed over
  # the Foundation wire seam, bounded scheduler/service tail, and Objective-C++
  # adapter. MacScopeApp embeds and signs this product, but never compiles or
  # links its native implementation or package resources.
  NativeDecompilerXPCService:
    type: xpc-service
    platform: macOS
    deploymentTarget: "27.0"
    preBuildScripts:
      - name: Verify certificate-backed signing environment
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/../Scripts/check_local_signing_policy.py" --build-environment --target "$TARGET_NAME"
      - name: Build verified native decompiler bridge
        basedOnDependencyAnalysis: true
        inputFileLists:
          - "$(MACSCOPE_NATIVE_BRIDGE_INPUT_FILE_LIST)"
        outputFileLists:
          - "$(MACSCOPE_NATIVE_BRIDGE_OUTPUT_FILE_LIST)"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/native_release_admission.py" phase \
              --repository-root "$SRCROOT/.." --phase bridge
            exit 0
          fi
          if [ -z "${MACSCOPE_SLEIGH_MATERIALIZATION_ROOT:-}" ]; then
            echo "ERROR: MACSCOPE_SLEIGH_MATERIALIZATION_ROOT is required for NativeDecompilerXPCService" >&2
            exit 1
          fi
          REPOSITORY_ROOT="$(cd "$SRCROOT/.." && pwd -P)"
          BRIDGE_PAYLOAD="$SRCROOT/../Scripts/native-decompiler-xpc/native_bridge_cache_payload.py"
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            # Routine Debug only (R11.2): stage the shared verified, path-free
            # bridge archive keyed by wrapper sources + SLEIGH key + toolchain
            # instead of a cold CMake build per DerivedData. Status 3 (no cache,
            # dirty sources, or a SLEIGH root other than the cache view) keeps
            # the local build. Release, qualification and Gate F never take this
            # path and keep building from source.
            BRIDGE_STATUS=0
            BRIDGE_CONTRACT="$(PATH="/opt/homebrew/bin:$PATH" /usr/bin/python3 -B \
              "$SRCROOT/../Scripts/qualification/dev_dependency_cache.py" \
              resolve --component native-bridge --repository-root "$REPOSITORY_ROOT" \
              --materialization-root "$MACSCOPE_SLEIGH_MATERIALIZATION_ROOT")" || BRIDGE_STATUS=$?
            if [ "$BRIDGE_STATUS" = 0 ]; then
              BRIDGE_VIEW="$(printf '%s\n' "$BRIDGE_CONTRACT" | /usr/bin/sed -n 's/^MACSCOPE_NATIVE_DECOMPILER_CACHED_VIEW=//p')"
              /usr/bin/python3 -B "$BRIDGE_PAYLOAD" stage \
                --view "${BRIDGE_VIEW:?}" \
                --build-root "$MACSCOPE_NATIVE_DECOMPILER_BUILD_ROOT" \
                --repository-root "$REPOSITORY_ROOT" \
                --materialization-root "$MACSCOPE_SLEIGH_MATERIALIZATION_ROOT" \
                --sdk-root "$SDKROOT"
              exit 0
            elif [ "$BRIDGE_STATUS" != 3 ]; then
              echo "ERROR: shared dependency cache rejected the native decompiler bridge" >&2
              exit 1
            fi
          fi
          /usr/bin/python3 -B "$BRIDGE_PAYLOAD" clear-projection \
            --build-root "$MACSCOPE_NATIVE_DECOMPILER_BUILD_ROOT"
          WRAPPER_REVISION="$(/usr/bin/python3 -B \
            "$SRCROOT/../Scripts/native-decompiler-xpc/native_decompiler_source_identity.py" \
            --repository-root "$REPOSITORY_ROOT" \
            --profile wrapper)"
          "$SRCROOT/../Scripts/native-decompiler-xpc/build_native_bridge.sh" \
            --source-root "$REPOSITORY_ROOT/Tools/NativeDecompilerBridge" \
            --build-root "$MACSCOPE_NATIVE_DECOMPILER_BUILD_ROOT" \
            --materialization-root "$MACSCOPE_SLEIGH_MATERIALIZATION_ROOT" \
            --wrapper-revision "$WRAPPER_REVISION" \
            --configuration Release
      - name: Stage verified native decompiler package
        # The external package is a closed verified tree. Xcode cannot observe every nested leaf
        # through a directory input, so re-run the verifier/stager and let its digest identity
        # safely reuse an already identical destination.
        basedOnDependencyAnalysis: false
        inputFileLists:
          - "$(MACSCOPE_NATIVE_PACKAGE_INPUT_FILE_LIST)"
        outputFileLists:
          - "$(MACSCOPE_NATIVE_PACKAGE_OUTPUT_FILE_LIST)"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/native_release_admission.py" phase \
              --repository-root "$SRCROOT/.." --phase package
            exit 0
          fi
          if [ -z "${MACSCOPE_SLEIGH_MATERIALIZATION_ROOT:-}" ]; then
            echo "ERROR: MACSCOPE_SLEIGH_MATERIALIZATION_ROOT is required for NativeDecompilerXPCService" >&2
            exit 1
          fi
          # Routine Debug only: reuse the last verified run when nothing it reads
          # changed (Scripts/build_phase_stamp.py). Release and qualification
          # (source-qualified) builds always run the full check below.
          PHASE_STAMP=""
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            PHASE_STAMP="$SRCROOT/../Scripts/build_phase_stamp.py"
            if /usr/bin/python3 -B "$PHASE_STAMP" check native-package-stage; then
              exit 0
            fi
          fi
          STAGE_METADATA_DIR="$TARGET_TEMP_DIR/NativeDecompilerPackageStage"
          /bin/mkdir -p "$STAGE_METADATA_DIR"
          /usr/bin/python3 -B "$SRCROOT/../Scripts/native-decompiler-xpc/stage_xcode_resources.py" \
            --source-materialization-root "$MACSCOPE_SLEIGH_MATERIALIZATION_ROOT" \
            --target-build-dir "$TARGET_BUILD_DIR" \
            --unlocalized-resources-folder-path "$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --metadata-directory "$STAGE_METADATA_DIR"
          if [ -n "$PHASE_STAMP" ]; then
            /usr/bin/python3 -B "$PHASE_STAMP" record native-package-stage
          fi
      - name: Validate native decompiler bridge golden
        # The preceding always-run stage fully verifies the package source and destination.
        # Depend on its digest-bound stamp instead of rediscovering the staged tree one build late.
        basedOnDependencyAnalysis: true
        inputFileLists:
          - "$(MACSCOPE_NATIVE_GOLDEN_INPUT_FILE_LIST)"
        outputFileLists:
          - "$(MACSCOPE_NATIVE_GOLDEN_OUTPUT_FILE_LIST)"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/native_release_admission.py" phase \
              --repository-root "$SRCROOT/.." --phase golden
            exit 0
          fi
          STAGED_MATERIALIZATION_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NativeDecompilerPackage"
          "$SRCROOT/../Scripts/native-decompiler-xpc/run_native_bridge_golden.sh" \
            --build-root "$MACSCOPE_NATIVE_DECOMPILER_GOLDEN_BUILD_ROOT" \
            --materialization-root "$STAGED_MATERIALIZATION_ROOT" \
            --native-archive-root "$MACSCOPE_NATIVE_DECOMPILER_BUILD_ROOT" \
            --stage-stamp "$TARGET_TEMP_DIR/NativeDecompilerPackageStage/NativeDecompilerPackage.stage.json" \
            --developer-dir "$DEVELOPER_DIR" \
            --sdk-root "$SDKROOT" \
            --sdk-name "$SDK_NAME" \
            --target-build-dir "$TARGET_BUILD_DIR" \
            --project-temp-dir "$PROJECT_TEMP_DIR" \
            --result "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NativeDecompilerBridgeGolden.json"
    sources:
      - path: Models/NativeDecompilerWire/NativeDecompilerWireBinaryPropertyListValidator.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireCodec.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWirePrimitives.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireTargetProfile.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireAuthoredModels.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireCanonicalRequest.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireResultModels.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerWireSemanticValidator.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerXPCPeerRequirement.swift
      - path: Models/NativeDecompilerWire/NativeDecompilerLiveXPCTestProtocol.swift
      - path: NativeDecompilerXPCService/NativeDecompilerCancellationState.swift
      - path: NativeDecompilerXPCService/NativeDecompilerLiveXPCTestControl.swift
      - path: NativeDecompilerXPCService/NativeDecompilerRequestScheduler.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceComposition.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceHost.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceListenerDelegate.swift
      - path: NativeDecompilerXPCService/NativeDecompilerXPCPrincipal.swift
      - path: Services/XPC/OwnedChildWire.swift
      - path: NativeDecompilerXPCService/main.swift
      - path: NativeDecompilerXPCService/Bridge/NativeDecompilerWireBridge.hpp
      - path: NativeDecompilerXPCService/Bridge/NativeDecompilerWireCodec.mm
      - path: NativeDecompilerXPCService/Bridge/NativeDecompilerObjCBridge.h
      - path: NativeDecompilerXPCService/Bridge/NativeDecompilerObjCBridge.mm
      - path: NativeDecompilerXPCService/NativeDecompilerXPCService-Bridging-Header.h
    settings:
      base:
        PRODUCT_NAME: NativeDecompilerXPCService
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app.NativeDecompiler
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NativeDecompilerXPCService/Info.plist
        SKIP_INSTALL: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
        HEADER_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/NativeDecompilerXPCService/Bridge" "$(SRCROOT)/../Tools/NativeDecompilerBridge/include"'
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -fvisibility=hidden -fvisibility-inlines-hidden"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(MACSCOPE_NATIVE_DECOMPILER_LIVE_TEST_CONDITION)"
        # Final linking consumes only the atomically published, digest-bound
        # Xcode-owned package snapshot. Ordinary bootstrap supplies the
        # schema-2 source-built external materialization; an explicit schema-1
