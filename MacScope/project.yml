  MacScopeApp:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    preBuildScripts:
      - name: Verify certificate-backed signing environment
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/../Scripts/check_local_signing_policy.py" --build-environment --target "$TARGET_NAME"
      - name: Stage verified Ghostty surface build inputs
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/../Scripts/dependencies/stage_verified_ghostty_surface.py"
          - "$(MACSCOPE_GHOSTTY_SURFACE_MANIFEST)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_INPUT_ARCHIVE)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_INPUT_HEADER)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_INPUT_MODULE_MAP)"
        outputFiles:
          - "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_DESCRIPTOR)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_ARCHIVE)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_HEADER)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_MODULE_MAP)"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/release_phase_receipt_reuse.py" \
              --phase ghostty-surface --current-release
            exit 0
          fi
          if [ -z "${MACSCOPE_GHOSTTY_SURFACE_ARTIFACT_ROOT:-}" ] || \
             [ -z "${MACSCOPE_GHOSTTY_SURFACE_MANIFEST:-}" ]; then
            echo "ERROR: verified Ghostty surface inputs are required" >&2
            exit 1
          fi
          /bin/mkdir -p "$PROJECT_TEMP_DIR"
          /usr/bin/python3 -B "$SRCROOT/../Scripts/dependencies/stage_verified_ghostty_surface.py" \
            --manifest "$MACSCOPE_GHOSTTY_SURFACE_MANIFEST" \
            --artifact-root "$MACSCOPE_GHOSTTY_SURFACE_ARTIFACT_ROOT" \
            --destination "$MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT" \
            --allowed-root "$PROJECT_TEMP_DIR"
      - name: Build repository-owned Ghostty VT
        # Build the vendored, checksum-governed source directly into Xcode-owned DerivedData.
        # The phase always runs because source/package/toolchain identity and signing identity
        # are not fully represented by Xcode's timestamp graph.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../Scripts/build_ghostty_vt.sh"
          - "$(SRCROOT)/../Scripts/dependencies/stage_verified_ghostty_vt.py"
          - "$(SRCROOT)/../Scripts/dependencies/stage_verified_ghostty_surface.py"
          - "$(SRCROOT)/../Scripts/ghostty-vt-source.contract"
          - "$(SRCROOT)/../Scripts/dependencies/zig_toolchain_receipt.py"
          - "$(SRCROOT)/../Scripts/qualification/dev_dependency_cache.py"
          - "$(SRCROOT)/../Scripts/qualification/dependency_cache.py"
          - "$(SRCROOT)/../ThirdParty/GhosttyVT/Source/build.zig"
          - "$(SRCROOT)/../ThirdParty/GhosttyVT/Source/build.zig.zon"
        outputFiles:
          - "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/lib/.macscope-ghostty-vt-manifest"
          - "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/lib/libghostty-vt.dylib"
          - "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include/ghostty/vt.h"
          - "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include/module.modulemap"
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libghostty-vt.dylib"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/release_phase_receipt_reuse.py" \
              --phase ghostty-vt --current-release
            exit 0
          fi
          umask 077
          # Routine Debug only: reuse the last verified run when nothing it reads
          # changed (Scripts/build_phase_stamp.py). Release and qualification
          # (source-qualified) builds always run the full check below.
          PHASE_STAMP=""
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            PHASE_STAMP="$SRCROOT/../Scripts/build_phase_stamp.py"
            if /usr/bin/python3 -B "$PHASE_STAMP" check ghostty-vt; then
              exit 0
            fi
          fi

          EXPECTED_BUILD_ROOT="$CONFIGURATION_TEMP_DIR/MacScopeGhosttyVT"
          if [ "${MACSCOPE_GHOSTTY_VT_BUILD_ROOT:-}" != "$EXPECTED_BUILD_ROOT" ]; then
            echo "ERROR: Ghostty VT output must remain inside Xcode DerivedData" >&2
            exit 1
          fi
          /bin/mkdir -p "$MACSCOPE_GHOSTTY_VT_BUILD_ROOT"
          VT_ARTIFACT_ROOT="${MACSCOPE_GHOSTTY_VT_VERIFIED_ARTIFACT_ROOT:-}"
          VT_DESCRIPTOR="${MACSCOPE_GHOSTTY_VT_VERIFIED_DESCRIPTOR:-}"
          VT_DESCRIPTOR_SHA256="${MACSCOPE_GHOSTTY_VT_VERIFIED_DESCRIPTOR_SHA256:-}"
          if [ -z "$VT_ARTIFACT_ROOT$VT_DESCRIPTOR$VT_DESCRIPTOR_SHA256" ] && [ -n "$PHASE_STAMP" ]; then
            # Routine Debug outside qualification: stage the shared verified,
            # content-addressed VT build (same key as the qualifier) instead of
            # recompiling Zig per DerivedData. Status 3 keeps the local build.
            VT_STATUS=0
            VT_CONTRACT="$(/usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/dev_dependency_cache.py" \
              resolve --component ghostty-vt --repository-root "$SRCROOT/..")" || VT_STATUS=$?
            if [ "$VT_STATUS" = 0 ]; then
              VT_ARTIFACT_ROOT="$(printf '%s\n' "$VT_CONTRACT" | /usr/bin/sed -n 's/^MACSCOPE_GHOSTTY_VT_VERIFIED_ARTIFACT_ROOT=//p')"
              VT_DESCRIPTOR="$(printf '%s\n' "$VT_CONTRACT" | /usr/bin/sed -n 's/^MACSCOPE_GHOSTTY_VT_VERIFIED_DESCRIPTOR=//p')"
              VT_DESCRIPTOR_SHA256="$(printf '%s\n' "$VT_CONTRACT" | /usr/bin/sed -n 's/^MACSCOPE_GHOSTTY_VT_VERIFIED_DESCRIPTOR_SHA256=//p')"
            elif [ "$VT_STATUS" != 3 ]; then
              echo "ERROR: shared dependency cache rejected Ghostty VT" >&2
              exit 1
            fi
          fi
          if [ -n "$VT_ARTIFACT_ROOT$VT_DESCRIPTOR$VT_DESCRIPTOR_SHA256" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/dependencies/stage_verified_ghostty_vt.py" \
              --artifact-root "${VT_ARTIFACT_ROOT:?}" \
              --descriptor "${VT_DESCRIPTOR:?}" \
              --descriptor-sha256 "${VT_DESCRIPTOR_SHA256:?}" \
              --destination "$MACSCOPE_GHOSTTY_VT_BUILD_ROOT/artifacts" \
              --allowed-root "$MACSCOPE_GHOSTTY_VT_BUILD_ROOT"
          else
            "$SRCROOT/../Scripts/build_ghostty_vt.sh" \
              --work-root "$MACSCOPE_GHOSTTY_VT_BUILD_ROOT"
          fi

          BUNDLE_TEMPORARY=""
          cleanup_ghostty_vt_bundle() {
            if [ -n "$BUNDLE_TEMPORARY" ] && [ -f "$BUNDLE_TEMPORARY" ]; then
              /bin/rm -f "$BUNDLE_TEMPORARY"
            fi
          }
          trap cleanup_ghostty_vt_bundle EXIT INT TERM

          DEST_DIR="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          /bin/mkdir -p "$DEST_DIR"
          BUNDLE_DYLIB="$DEST_DIR/libghostty-vt.dylib"
          BUNDLE_TEMPORARY="$(/usr/bin/mktemp "$DEST_DIR/.libghostty-vt.dylib.XXXXXX")"
          /bin/cp -f "$MACSCOPE_GHOSTTY_VT_BUILD_ROOT/artifacts/lib/libghostty-vt.dylib" "$BUNDLE_TEMPORARY"
          /bin/chmod 0700 "$BUNDLE_TEMPORARY"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              --identifier org.macscope.app.GhosttyVT --options runtime \
              --timestamp=none "$BUNDLE_TEMPORARY"
          fi
          /bin/chmod 0555 "$BUNDLE_TEMPORARY"
          /bin/mv -f "$BUNDLE_TEMPORARY" "$BUNDLE_DYLIB"
          BUNDLE_TEMPORARY=""
          trap - EXIT INT TERM
          if [ -n "$PHASE_STAMP" ]; then
            /usr/bin/python3 -B "$PHASE_STAMP" record ghostty-vt
          fi
    # Embed and sign the analysis worker so the default live NSXPCConnection can
    # resolve it from MacScope.app/Contents/XPCServices. Certificate-backed signing
    # keeps the nested service and the CoreTests TEST_HOST on the supported path.
    dependencies:
      - package: RecoveryKit
        product: RecoveryKit
      - target: MacScopeAnalysisCore
        link: false
      - target: MacScopeDebuggerCore
        link: false
      # Public audit-token accessors used by the gate-owned dynamic process
      # authority. System SDK library only; never copied or embedded.
      - sdk: libbsm.tbd
      - package: Lumen
        product: LumenTokens
      - package: Lumen
        product: LumenUI
      - package: Lumen
        product: LumenConformance
      - target: SwiftAssemblyVendor
      - target: AnalysisWorkerXPCService
        embed: true
        codeSign: true
      - target: AIAgentWorkerXPCService
        embed: true
        codeSign: true
      - target: NativeDecompilerXPCService
        embed: true
        codeSign: true
      - target: ShellBrokerXPCService
        embed: true
        codeSign: true
      - target: ShellBrokerLaunchAgent
      - target: SourceExecutionRunner
    sources:
      - path: ../ThirdParty/REA/licenses
        type: folder
        buildPhase: resources
      - path: App
        excludes:
          - "**/.DS_Store"
          - HeadlessWorkspaceAcceptance.swift
