        MacScopeApp: all
        CoreTests: [test]
        Phase2Tests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - MacScopeApp
      targets:
        # Xcode runs whole CoreTests classes concurrently in cloned MacScope.app
        # test hosts. Classes isolate filesystem, defaults and subprocess state
        # per test; preserve isolation when adding shared global state.
        - name: CoreTests
          parallelizable: true
        - name: Phase2Tests
          parallelizable: true
  # One scheme per test bundle: dev_loop builds only the bundle its selectors name.
  CoreTests:
    build:
      targets:
        MacScopeApp: all
        CoreTests: [test]
    test:
      targets:
        - name: CoreTests
          parallelizable: true
  Phase2Tests:
    build:
      targets:
        MacScopeApp: all
        Phase2Tests: [test]
    test:
      targets:
        - name: Phase2Tests
          parallelizable: true
  MacScopeInstalledAppUITests:
    build:
      targets:
        MacScopeApp: all
        MacScopeInstalledAppUITests: [test]
    test:
      targets:
        - MacScopeInstalledAppUITests
