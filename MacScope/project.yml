      - path: ShellBrokerService/Phase2ShellBrokerPrincipal.swift
      # Compile the service's pure Swift orchestration into CoreTests while the
      # production-only Objective-C++ bridge and executable main remain isolated
      # in NativeDecompilerXPCService.
      - path: NativeDecompilerXPCService/NativeDecompilerCancellationState.swift
      - path: NativeDecompilerXPCService/NativeDecompilerRequestScheduler.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceHost.swift
      - path: NativeDecompilerXPCService/NativeDecompilerXPCPrincipal.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceListenerDelegate.swift
      - path: NativeDecompilerXPCService/NativeDecompilerServiceComposition.swift
      - path: Services/XPC/OwnedChildWire.swift
      - path: Tests/CoreTests
        # GoldenFixtures holds differential SOURCES (corpus/*.swift,*.m — must NOT compile into the
        # test bundle), git-ignored captured oracle JSONs, and built corpus binaries. The tests read
        # them from the source tree via #filePath, never the bundle, so the whole subtree is excluded
        # from the target — otherwise the corpus sources get compiled and the per-binary ghidra.json
        # files collide in the flat copy-resources phase.
        excludes:
          - "**/.DS_Store"
          - GoldenFixtures/**
          # Owned D01 assembly/object are loaded from the source tree by the
          # focused test; neither belongs in Swift compilation or bundle copy.
          - Support/A64Oracle/Fixtures/**
          # Header-only H1 parser fixture, preprocessed explicitly by its focused test.
          - Fixtures/libjpeg-turbo-3.2.0/**
          - NativeDecompilerObjCBridgeTests.mm
          - NativeDecompilerObjCBridgeCrossLanguageTests.swift
    dependencies:
      - target: MacScopeApp
      - target: MacScopeTestSupport
      - package: RecoveryKit
        product: RecoveryKit
        link: false
        embed: false
      - sdk: JavaScriptCore.framework
      # Hosted tests import these modules but resolve their symbols from the app.
      # A second link owner promotes automatic package products to frameworks.
      - package: Lumen
        product: LumenTokens
        link: false
        embed: false
      - package: Lumen
        product: LumenUI
        link: false
        embed: false
      - package: Lumen
        product: LumenConformance
        link: false
        embed: false
    settings:
      base:
        PRODUCT_NAME: CoreTests
        PRODUCT_MODULE_NAME: CoreTests
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -testable-import-module -Xfrontend MacScopeAnalysisCore -Xfrontend -testable-import-module -Xfrontend MacScopeDebuggerCore"
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app.CoreTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacScope.app/Contents/MacOS/MacScope"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        # Explicitly empty so XcodeGen does not adopt an Info.plist found under the excluded
        # GoldenFixtures tree. Generation runs in a temporary staging directory and XcodeGen
        # would store that plist relative to it, which only resolves from worktrees no deeper
        # than the staging directory.
        INFOPLIST_FILE: ""
        MACSCOPE_GHOSTTY_VT_BUILD_ROOT: "$(CONFIGURATION_TEMP_DIR)/MacScopeGhosttyVT"
        MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT: "$(PROJECT_TEMP_DIR)/MacScopeGhosttySurface"
        MACSCOPE_GHOSTTY_SURFACE_ARCHIVE: "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/libghostty-internal.a"
        HEADER_SEARCH_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include" "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers"'
        LIBRARY_SEARCH_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/lib"'
        OTHER_LDFLAGS: "$(inherited) $(MACSCOPE_GHOSTTY_SURFACE_ARCHIVE) -lc++ -framework Carbon -framework GameController $(MACSCOPE_PARSER_ENGINES_LDFLAGS)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTING_PARSER_ENGINES TESTING_REA_WORKER_HOST TESTING_WORKER_PRINCIPAL TESTING_SHELL_BROKER_PRINCIPAL TESTING_NATIVE_DECOMPILER_SERVICE_COMPOSITION $(MACSCOPE_NATIVE_DECOMPILER_LIVE_TEST_CONDITION) $(MACSCOPE_GHOSTTY_SURFACE_ENABLED)"
        SWIFT_INCLUDE_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include" "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers" $(MACSCOPE_PARSER_ENGINES_INCLUDE) "$(SRCROOT)/Support/ChildProcessC"'
    preBuildScripts:
      - name: Stage call-argument oracle test resources
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/../Scripts/decompiler-oracles/call_argument_oracle.py"
          - "$(SRCROOT)/../Scripts/decompiler-oracles/fixtures/call-arguments/call_arguments.c"
          - "$(SRCROOT)/../Scripts/decompiler-oracles/fixtures/call-arguments/entry_capture.s"
          - "$(SRCROOT)/../Scripts/decompiler-oracles/fixtures/call-arguments/objc_call_arguments.m"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/call_argument_oracle.py"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/call-arguments/call_arguments.c"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/call-arguments/entry_capture.s"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/call-arguments/objc_call_arguments.m"
        script: |
          set -eu
          SOURCE_ROOT="$SRCROOT/../Scripts/decompiler-oracles"
          RESOURCE_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          FIXTURE_DESTINATION="$RESOURCE_ROOT/call-arguments"
          /bin/mkdir -p "$FIXTURE_DESTINATION"
          /usr/bin/install -m 0444 "$SOURCE_ROOT/call_argument_oracle.py" "$RESOURCE_ROOT/call_argument_oracle.py"
          /usr/bin/install -m 0444 "$SOURCE_ROOT/fixtures/call-arguments/call_arguments.c" "$FIXTURE_DESTINATION/call_arguments.c"
          /usr/bin/install -m 0444 "$SOURCE_ROOT/fixtures/call-arguments/entry_capture.s" "$FIXTURE_DESTINATION/entry_capture.s"
          /usr/bin/install -m 0444 "$SOURCE_ROOT/fixtures/call-arguments/objc_call_arguments.m" "$FIXTURE_DESTINATION/objc_call_arguments.m"
    # Copy the app's already-produced provenance into the Gate test bundle before
    # Xcode seals CoreTests. The app target dependency above must complete first.
    # The exact source and destination form a complete dependency graph, so an
    # unchanged sealed input must not invalidate and re-seal CoreTests.
    postBuildScripts:
      - name: Copy sealed provenance into CoreTests
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/MacScope.app/Contents/Resources/MacScopeBuildProvenance.json"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MacScopeBuildProvenance.json"
        script: |
          set -eu
          if [ "$CONFIGURATION" != "Release" ] && [ "$CONFIGURATION" != "Debug" ]; then
            exit 1
          fi
          SOURCE="$BUILT_PRODUCTS_DIR/MacScope.app/Contents/Resources/MacScopeBuildProvenance.json"
          DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MacScopeBuildProvenance.json"
          if [ ! -f "$SOURCE" ] || [ -L "$SOURCE" ]; then
            echo "ERROR: sealed app provenance is missing or is not a regular file" >&2
            exit 1
          fi
          /bin/mkdir -p "$(/usr/bin/dirname "$DESTINATION")"
          TEMPORARY="$(/usr/bin/mktemp "$DESTINATION.tmp.XXXXXX")"
          cleanup() { /bin/rm -f "$TEMPORARY"; }
          trap cleanup 0 1 2 15
          /bin/cp -p "$SOURCE" "$TEMPORARY"
          if [ ! -f "$TEMPORARY" ] || [ -L "$TEMPORARY" ]; then
            echo "ERROR: temporary CoreTests provenance is not a regular file" >&2
            exit 1
          fi
          /usr/bin/cmp -s "$SOURCE" "$TEMPORARY" || {
            echo "ERROR: CoreTests provenance copy changed bytes" >&2
            exit 1
          }
          SOURCE_MODE="$(/usr/bin/stat -f '%Lp' "$SOURCE")"
          TEMPORARY_MODE="$(/usr/bin/stat -f '%Lp' "$TEMPORARY")"
          if [ "$SOURCE_MODE" != "$TEMPORARY_MODE" ]; then
            echo "ERROR: CoreTests provenance copy changed file mode" >&2
            exit 1
          fi
          /bin/mv -f "$TEMPORARY" "$DESTINATION"
          trap - 0 1 2 15
          if [ ! -f "$DESTINATION" ] || [ -L "$DESTINATION" ]; then
            echo "ERROR: CoreTests provenance destination is not a regular file" >&2
            exit 1
          fi
          /usr/bin/cmp -s "$SOURCE" "$DESTINATION" || {
            echo "ERROR: installed CoreTests provenance changed bytes" >&2
            exit 1
          }
          DESTINATION_MODE="$(/usr/bin/stat -f '%Lp' "$DESTINATION")"
          if [ "$SOURCE_MODE" != "$DESTINATION_MODE" ]; then
            echo "ERROR: installed CoreTests provenance changed file mode" >&2
            exit 1
          fi
