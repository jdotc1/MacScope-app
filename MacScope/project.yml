      - path: AnalysisWorkerService/AnalysisWorkerProcessControl.swift
      - path: AnalysisWorkerService/MachOKitDyldCacheAnalysisProvider.swift
      - path: AnalysisWorkerService/NativeParserEngines.swift
      # HOP-5: the offline-generated SDK signature pack (Scripts/signatures/); discovery reads its
      # noReturn names. The app gets the same file through its Resources folder.
      - path: Resources/SDKCallSignaturePack.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AnalysisWorkerXPCService
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app.AnalysisWorker
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AnalysisWorkerService/Info.plist
        SKIP_INSTALL: YES
        SWIFT_INCLUDE_PATHS: '$(inherited) $(MACSCOPE_PARSER_ENGINES_INCLUDE) "$(MACSCOPE_PATTERN_ADAPTER_ROOT)" "$(SRCROOT)/Support/ChildProcessC"'
        OTHER_LDFLAGS: '$(inherited) $(BUILT_PRODUCTS_DIR)/libMacScopeAnalysisCore.a $(MACSCOPE_PARSER_ENGINES_LDFLAGS) "$(MACSCOPE_PATTERN_ADAPTER_ROOT)/MacScopePatternAdapter.a" -framework Foundation -lc++'
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -testable-import-module -Xfrontend MacScopeAnalysisCore"
  # Dedicated provider worker for Phase 2 AI turns. Its network authority is limited to exact
