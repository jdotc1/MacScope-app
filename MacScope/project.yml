  # .xpc would pull code-signing into the unit-test build (CoreTests loads the app
  # as its TEST_HOST), which is fragile in headless CI. To SHIP the live service,
  # add this to the app target's `dependencies:` with `embed: true, codeSign: true`
  # (XcodeGen then copies it into MacScope.app/Contents/XPCServices and signs it):
  #
  #   MacScopeApp:
  #     dependencies:
  #       - target: PluginXPCService
  #         embed: true
  #         codeSign: true
  #
  # See integrationRisks in the task report for the exact embed/sign tail.
  PluginXPCService:
