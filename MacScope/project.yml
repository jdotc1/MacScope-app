  # Bundled analysis-worker XPC product. Its source list is intentionally closed over only the
  # real AnalysisEngine dependency graph plus the worker-side XPC seam and runtime tail. In
  # particular it does NOT compile Stores, Features/SwiftUI, scripting, debugger, exporters,
  # golden tooling, plugin hosting, or the client-side XPC provider/transport.
  #
  # MacScopeApp embeds and signs this service as a target dependency above. Keep
  # the source list closed and preserve certificate-backed signing because
  # CoreTests loads the containing MacScope.app as its TEST_HOST.
  AnalysisWorkerXPCService:
    type: xpc-service
    platform: macOS
    deploymentTarget: "27.0"
    preBuildScripts:
      - name: Verify certificate-backed signing environment
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/../Scripts/check_local_signing_policy.py" --build-environment --target "$TARGET_NAME"
      - name: Require retained pattern adapter
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          expected="<dependency cache root>/pattern-adapter/<content key>"
          if [ -z "${MACSCOPE_PATTERN_ADAPTER_ROOT:-}" ]; then
            echo "ERROR: MACSCOPE_PATTERN_ADAPTER_ROOT is not set. Supply the retained staged pattern adapter root, expected at $expected." >&2
            exit 1
          fi
          case "$MACSCOPE_PATTERN_ADAPTER_ROOT" in
            /*) ;;
            *) echo "ERROR: MACSCOPE_PATTERN_ADAPTER_ROOT must be absolute: $MACSCOPE_PATTERN_ADAPTER_ROOT (expected at $expected)" >&2; exit 1 ;;
          esac
          # The retained native build receipt owns these already-staged inputs.
          # Admission checks presence only; Xcode never rebuilds or rehashes them.
          for staged in MacScopePatternAdapter.a module.modulemap include/MacScopePatternAdapter.h; do
            if [ ! -f "$MACSCOPE_PATTERN_ADAPTER_ROOT/$staged" ]; then
              echo "ERROR: retained pattern adapter root $MACSCOPE_PATTERN_ADAPTER_ROOT is missing or unreachable: no $staged (expected at $expected)" >&2
              exit 1
            fi
          done
      - name: Stage cached parser engines
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(MACSCOPE_PARSER_ENGINES_ROOT)/STAGED.json"
        script: |
          set -eu
          # Prebuilt LIEF / pe-parse / go-macho archives come from the shared content-addressed
          # dependency cache, keyed by pinned source, builder and toolchain. Unchanged inputs
          # return in milliseconds; a new key builds once per machine (never per worktree).
          CACHE_ROOT="${MACSCOPE_DEPENDENCY_CACHE_ROOT:-${MACSCOPE_PARSER_ENGINE_CACHE_ROOT:-}}"
          if [ -z "$CACHE_ROOT" ]; then
            echo "ERROR: MACSCOPE_PARSER_ENGINE_CACHE_ROOT (DependencyRoots.xcconfig) is required" >&2
            exit 1
          fi
          /usr/bin/python3 -B "$SRCROOT/../Scripts/dependencies/build_parser_engines.py" stage \
            --destination "$MACSCOPE_PARSER_ENGINES_ROOT" --cache-root "$CACHE_ROOT"
      - name: Verify canonical embedded REA resource
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/release_phase_receipt_reuse.py" \
              --phase rea --current-release
            exit 0
          fi
          # Routine Debug only: reuse the last verified run when nothing it reads
          # changed (Scripts/build_phase_stamp.py). Release and qualification
          # (source-qualified) builds always run the full check below.
          PHASE_STAMP=""
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            PHASE_STAMP="$SRCROOT/../Scripts/build_phase_stamp.py"
            if /usr/bin/python3 -B "$PHASE_STAMP" check rea-resource; then
              exit 0
            fi
          fi
          /usr/bin/python3 -B "$SRCROOT/../Scripts/dependencies/rea_verify.py"
          if [ -n "$PHASE_STAMP" ]; then
            /usr/bin/python3 -B "$PHASE_STAMP" record rea-resource
          fi
      - name: Verify exact MachOKit source materialization
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT)/MATERIALIZATION.json"
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/release_phase_receipt_reuse.py" \
              --phase machokit --current-release
            exit 0
          fi
          if [ -z "${MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT:-}" ]; then
            echo "ERROR: MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT is required" >&2
            exit 1
          fi
          # Routine Debug only: reuse the last verified run when nothing it reads
          # changed (Scripts/build_phase_stamp.py). Release and qualification
          # (source-qualified) builds always run the full check below.
          PHASE_STAMP=""
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            PHASE_STAMP="$SRCROOT/../Scripts/build_phase_stamp.py"
            if /usr/bin/python3 -B "$PHASE_STAMP" check machokit-source; then
              exit 0
            fi
          fi
          /usr/bin/python3 "$SRCROOT/../Scripts/machokit_source_identity.py" verify \
            --materialization-root "$MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT"
          VERIFIED_ROOT="$(cd "$MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT" && /bin/pwd -P)"
          PACKAGE_ROOT="$(cd "$SRCROOT/LocalPackages" && /bin/pwd -P)"
          if [ "$VERIFIED_ROOT" != "$PACKAGE_ROOT" ]; then
            echo "ERROR: LocalPackages resolves outside the verified MachOKit materialization" >&2
            exit 1
          fi
          if [ -n "$PHASE_STAMP" ]; then
            /usr/bin/python3 -B "$PHASE_STAMP" record machokit-source
          fi
    postBuildScripts:
      - name: Verify compiled MachOKit identity in AnalysisWorker
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ -n "${MACSCOPE_NATIVE_RELEASE_ADMISSION:-}" ]; then
            /usr/bin/python3 -B "$SRCROOT/../Scripts/qualification/release_phase_receipt_reuse.py" \
              --phase machokit-compiled --current-release
            exit 0
          fi
          # Routine Debug only: reuse the last verified run when nothing it reads
          # changed (Scripts/build_phase_stamp.py). Release and qualification
          # (source-qualified) builds always run the full check below.
          PHASE_STAMP=""
          if [ "${CONFIGURATION:-}" = Debug ] && [ "${MACSCOPE_DEBUG_SOURCE_IDENTITY:-}" = runtime-only ]; then
            PHASE_STAMP="$SRCROOT/../Scripts/build_phase_stamp.py"
            if /usr/bin/python3 -B "$PHASE_STAMP" check machokit-compiled; then
              exit 0
            fi
          fi
          /usr/bin/python3 -B "$SRCROOT/../Scripts/verify_machokit_analysis_worker_identity.py" \
            --executable "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" \
            --quiet
          if [ -n "$PHASE_STAMP" ]; then
            /usr/bin/python3 -B "$PHASE_STAMP" record machokit-compiled
          fi
    dependencies:
      - target: MacScopeAnalysisCore
        link: false
      - sdk: JavaScriptCore.framework
      - package: MachOKit
        product: MachOKit
    sources:
      - path: AnalysisWorkerService/REAJavaScriptHost.swift
      - path: ../ThirdParty/REA/licenses
        type: folder
        buildPhase: resources
      - path: ../ThirdParty/REA/generated/MacScopeREAKernel.js
        buildPhase: resources
      - path: Services/XPC/OwnedChildWire.swift
      - path: Services/XPC/PosixChildProcessOps.swift
      - path: AnalysisWorkerService/main.swift
