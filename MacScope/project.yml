    settings:
      base:
        PRODUCT_NAME: MacScope
        PRODUCT_BUNDLE_IDENTIFIER: org.macscope.app
        # Use the hand-authored Info.plist as-is. Do NOT add an `info:` block:
        # an `info:` block makes XcodeGen GENERATE/overwrite the file at its path,
        # stripping the rich UTExportedTypeDeclarations / CFBundleDocumentTypes.
        # Pointing INFOPLIST_FILE at the source keeps `xcodegen generate` idempotent.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Brand-violet global accent (the AccentColor.colorset). This makes the app's
        # accent resolve to #8B7CF6 everywhere the SwiftUI .tint cannot reach — AppKit
        # window chrome (e.g. the Settings tab-bar selector), Color.accentColor, and
        # NSColor.controlAccentColor — instead of the user's system accent (blue).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Localization readiness: Xcode extracts every SwiftUI/String(localized:) literal into
        # Resources/Localizable.xcstrings on build.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_TESTABILITY: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -testable-import-module -Xfrontend MacScopeAnalysisCore -Xfrontend -testable-import-module -Xfrontend MacScopeDebuggerCore"
        # Ghostty VT is built from repository-owned source directly into Xcode
        # DerivedData. The full-surface library retains its separately governed input.
        MACSCOPE_GHOSTTY_VT_BUILD_ROOT: "$(CONFIGURATION_TEMP_DIR)/MacScopeGhosttyVT"
        MACSCOPE_GHOSTTY_SURFACE_INPUT_HEADER: "$(MACSCOPE_GHOSTTY_SURFACE_ARTIFACT_ROOT)/macos-arm64/Headers/ghostty.h"
        MACSCOPE_GHOSTTY_SURFACE_INPUT_MODULE_MAP: "$(MACSCOPE_GHOSTTY_SURFACE_ARTIFACT_ROOT)/macos-arm64/Headers/module.modulemap"
        MACSCOPE_GHOSTTY_SURFACE_INPUT_ARCHIVE: "$(MACSCOPE_GHOSTTY_SURFACE_ARTIFACT_ROOT)/macos-arm64/libghostty-internal.a"
        MACSCOPE_GHOSTTY_SURFACE_MANIFEST: "$(MACSCOPE_GHOSTTY_SURFACE_SOURCE_DIR)/macos/.macscope-ghostty-surface-manifest"
        MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT: "$(PROJECT_TEMP_DIR)/MacScopeGhosttySurface"
        MACSCOPE_GHOSTTY_SURFACE_STAGED_DESCRIPTOR: "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/STAGED_GHOSTTY_SURFACE.json"
        MACSCOPE_GHOSTTY_SURFACE_HEADER: "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers/ghostty.h"
        MACSCOPE_GHOSTTY_SURFACE_MODULE_MAP: "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers/module.modulemap"
        MACSCOPE_GHOSTTY_SURFACE_ARCHIVE: "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/libghostty-internal.a"
        HEADER_SEARCH_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include" "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers"'
        LIBRARY_SEARCH_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/lib"'
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -force_load $(BUILT_PRODUCTS_DIR)/libMacScopeAnalysisCore.a -force_load $(BUILT_PRODUCTS_DIR)/libMacScopeDebuggerCore.a -lghostty-vt $(MACSCOPE_GHOSTTY_SURFACE_ARCHIVE) -lc++ -framework Carbon -framework GameController"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(MACSCOPE_NATIVE_DECOMPILER_LIVE_TEST_CONDITION) $(MACSCOPE_GHOSTTY_SURFACE_ENABLED)"
        SWIFT_INCLUDE_PATHS: '$(inherited) "$(MACSCOPE_GHOSTTY_VT_BUILD_ROOT)/artifacts/include" "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT)/Headers"'
        # The embedded native worker carries manifest-bound static archives as
        # runtime resources. Xcode's Copy Files stripping rewrites those archives
        # after the worker has been verified, invalidating the closed package.
        COPY_PHASE_STRIP: NO
      configs:
        Debug:
          # Preserve the signed executable inventory; opt out of Xcode's app
          # debug/preview dylibs without changing optimization or entitlements.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          # Production installs do not need the Debug test host's internal exports.
          ENABLE_TESTABILITY: NO
    # Deliberately the final app phase: both embedded XPC products have already
    # been copied, while Xcode's automatic CodeSign step has not sealed the app.
    postBuildScripts:
      - name: Stage ShellBroker LaunchAgent property list
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/ShellBrokerService/LaunchAgent.plist"
          - "$(BUILT_PRODUCTS_DIR)/ShellBrokerLaunchAgent"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/org.macscope.app.ShellBroker.agent.plist"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/ShellBrokerLaunchAgent"
        script: |
          set -euo pipefail
          DEST_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$DEST_DIR"
          /bin/cp -f "$SRCROOT/ShellBrokerService/LaunchAgent.plist" "$DEST_DIR/org.macscope.app.ShellBroker.agent.plist"
          /bin/cp -f "$BUILT_PRODUCTS_DIR/ShellBrokerLaunchAgent" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/ShellBrokerLaunchAgent"
      - name: Stage signed source execution runner
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/SourceExecutionRunner"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/SourceExecutionRunner"
        script: |
          set -euo pipefail
          /bin/cp -f "$BUILT_PRODUCTS_DIR/SourceExecutionRunner" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/SourceExecutionRunner"
      - name: Generate sealed Release build provenance
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerBridgeGolden.json"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerPackage/MATERIALIZATION.json"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerPackage/package"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerPackage/package/lib/libdecomp.a"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerPackage/package/lib/libsla.a"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/MacOS/NativeDecompilerXPCService"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/NativeDecompilerXPCService.xpc/Contents/_CodeSignature/CodeResources"
          - "$(MACSCOPE_GHOSTTY_SURFACE_MANIFEST)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_STAGED_DESCRIPTOR)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_ARCHIVE)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_HEADER)"
          - "$(MACSCOPE_GHOSTTY_SURFACE_MODULE_MAP)"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/XPCServices/AnalysisWorkerXPCService.xpc/Contents/MacOS/AnalysisWorkerXPCService"
          - "$(MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT)/MATERIALIZATION.json"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MacScopeBuildProvenance.json"
        script: |
          if [ "$CONFIGURATION" != "Release" ] && [ "$CONFIGURATION" != "Debug" ]; then
            exit 1
          fi
          /usr/bin/python3 "$SRCROOT/../Scripts/generate_release_build_provenance.py" \
            --repo-root "$SRCROOT/.." \
            --project-yml "$SRCROOT/project.yml" \
            --project-file-path "$PROJECT_FILE_PATH" \
            --configuration "$CONFIGURATION" \
            --debug-source-identity "$MACSCOPE_DEBUG_SOURCE_IDENTITY" \
            --ghostty-source-dir "$SRCROOT/../ThirdParty/GhosttyVT/Source" \
            --ghostty-surface-manifest "$MACSCOPE_GHOSTTY_SURFACE_MANIFEST" \
            --ghostty-surface-staged-root "$MACSCOPE_GHOSTTY_SURFACE_STAGED_ROOT" \
            --sleigh-materialization-root "$MACSCOPE_SLEIGH_MATERIALIZATION_ROOT" \
            --machokit-materialization-root "$MACSCOPE_MACHOKIT_MATERIALIZATION_ROOT" \
            --analysis-worker-executable "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/XPCServices/AnalysisWorkerXPCService.xpc/Contents/MacOS/AnalysisWorkerXPCService" \
            --native-decompiler-live-test-condition "$MACSCOPE_NATIVE_DECOMPILER_LIVE_TEST_CONDITION" \
            --swift-active-compilation-conditions "$SWIFT_ACTIVE_COMPILATION_CONDITIONS" \
            --other-swift-flags "$OTHER_SWIFT_FLAGS" \
            --architectures "$ARCHS" \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --sdk-name "$SDK_NAME" \
            --sdk-version "$SDK_VERSION" \
            --sdk-build "$SDK_PRODUCT_BUILD_VERSION" \
            --developer-dir "$DEVELOPER_DIR" \
            --swift-executable "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc" \
            --native-decompiler-golden-result "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/XPCServices/NativeDecompilerXPCService.xpc/Contents/Resources/NativeDecompilerBridgeGolden.json" \
            --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MacScopeBuildProvenance.json"
  # Bundled plugin XPC service. Self-contained: it compiles only the
