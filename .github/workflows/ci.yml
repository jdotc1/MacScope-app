name: CI

# Advisory native CI on the explicitly provisioned Apple-Silicon Xcode 27
# runner (D11: CI is not a merge gate; lanes merge on their focused dev-loop
# runs). It never runs on pull requests or merges. The nightly schedule
# (03:00 EDT) and manual dispatch run full CoreTests, governance and the
# sanitizers warm (one persistent run root whose DerivedData is keyed by
# toolchain/project identity, plus the shared compilation cache), on a shared
# heavy-gate slot at nice 15, so lanes' dev loops are never starved (D12). Scripts/ci/affected_selectors.py still selects tests for a
# dispatched PR-shaped run. GitHub does not currently provide a hosted macOS image
# with Xcode 27. Oracle-backed differential tests
# (GoldenFixtures corpus, captured reference/ghidra JSONs, dSYM oracles) read
# gitignored local assets and are skip-gated via XCTSkip, so they SKIP here by
# design — this lane verifies the hermetic surface, not the oracle
# differentials.

on:
  workflow_dispatch:
  schedule:
    # 03:00 EDT (07:00 UTC; 02:00 EST in winter): a quiet hour on this Mac.
    - cron: "0 7 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Build + CoreTests (Xcode 27, arm64)
    # A personal self-hosted runner must never execute code from a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode-27]
    timeout-minutes: 90
    env:
      # Owner desktop is in use. Window fixtures remain explicit uncovered scope.
      MACSCOPE_NONWINDOW_CORE_TESTS: "1"
      # Require the Xcode 27 family without pinning a specific
      # build number. Runner provisioning owns this stable bundle path.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # Retain source and complete incremental products at their original paths.
      # Runner temporary cleanup must not discard a failed run needed for a focused retry.
      # One persistent, warm run root (D9): never a fresh root per run.
      MACSCOPE_QUALIFICATION_WORK_ROOT_NAME: macscope-qualification-nightly
      # This private application is qualified only on the owner's Mac. Reuse
      # its governed cache; qualification still verifies every selected entry.
      # Retained, receipt-owned pattern adapter staged under the shared cache.
      # The build phase and the qualifier both fail closed if it is unreachable.
      # The certificate-backed Release candidate and the installed UI-test
      # bundle are consumed by installed acceptance, Gate F and installs.
      # Manual dispatch builds them; the nightly regression run does not.
      MACSCOPE_RELEASE_CANDIDATE: ${{ github.event_name == 'schedule' && 'skip' || 'build' }}
      MACSCOPE_INSTALLED_UI_PRODUCTS: ${{ github.event_name == 'schedule' && 'skip' || 'auto' }}
    steps:
      - name: Clear stale sparse checkout from the reused workspace
        shell: bash
        run: |
          # MACSCOPE_WORK_ROOT comes from the self-hosted runner's local .env file,
          # so no machine path is stored in the repository or its settings.
          : "${MACSCOPE_WORK_ROOT:?set MACSCOPE_WORK_ROOT in the runner .env file}"
          {
            echo "MACSCOPE_CI_QUALIFICATION_ROOT=$MACSCOPE_WORK_ROOT/MacScopeCIQualificationRuns"
            echo "MACSCOPE_DEPENDENCY_CACHE_ROOT=$MACSCOPE_WORK_ROOT/MacScopeQualificationCache-20260920"
            echo "MACSCOPE_PATTERN_ADAPTER_ROOT=$MACSCOPE_WORK_ROOT/MacScopeQualificationCache-20260920/pattern-adapter/ea4b6adacad1188f"
            echo "MACSCOPE_PATTERN_ADAPTER_RECEIPT=$MACSCOPE_WORK_ROOT/MacScopeQualificationCache-20260920/pattern-adapter/ea4b6adacad1188f/PRODUCER_RECEIPT.md"
          } >> "$GITHUB_ENV"
          # This runner reuses its workspace. A sparse (non-cone) checkout by an
          # earlier run left core.sparseCheckout=true in .git/config, which
          # actions/checkout's own `sparse-checkout disable` does not clear:
          # run 38220482163 materialized 158 of 79,888 files. Reset the sparse
          # state and the index so the checkout below repopulates every file.
          if [[ -d .git ]] && { [[ -e .git/info/sparse-checkout ]] ||
              [[ "$(git config --get --bool core.sparseCheckout || echo false)" == true ]]; }; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout .git/config.worktree .git/index
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # LFS payloads come from this Mac's local object stores below, never
          # from GitHub LFS bandwidth (about 400 MB per run with `lfs: true`).
          lfs: false

      - name: Materialize LFS payloads from local object stores
        shell: bash
        run: |
          # Copy any object this clone lacks from this Mac's other stores, then
          # check the payloads out locally. `git lfs checkout` never downloads.
          git lfs install --local --skip-smudge >/dev/null
          store="$(git rev-parse --git-common-dir)/lfs/objects"
          while read -r oid _marker path; do
            relative="${oid:0:2}/${oid:2:2}/${oid}"
            for seed in "$MACSCOPE_WORK_ROOT/.lfs-shared" "$MACSCOPE_WORK_ROOT/macscope/.git/lfs/objects"; do
              if [[ ! -f "$store/$relative" && -f "$seed/$relative" ]]; then
                mkdir -p "$store/${oid:0:2}/${oid:2:2}"
                cp "$seed/$relative" "$store/$relative"
              fi
            done
            test -f "$store/$relative" || { echo "LFS object for $path is not on this Mac" >&2; exit 1; }
          done < <(git lfs ls-files --long)
          git lfs checkout
          pointers="$(git lfs ls-files | grep -c ' - ' || true)"
          test "$pointers" = 0
          # Ignore submodules: this reused workspace keeps the previous run's
          # Lumen checkout, which differs from a newer pin until the Lumen step
          # below moves it (nightlies 38564641539 and 38733243996 failed here).
          test -z "$(git status --porcelain --untracked-files=no --ignore-submodules=all)"

      - name: Bind exact event source
        shell: bash
        run: |
          # Pin the immutable event commit, including a PR's synthetic merge.
          # Fetch from the checkout's canonical remote, never a fork remote or
          # a moving main tip. Qualification independently proves equality.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "+${GITHUB_SHA}:refs/remotes/origin/ci-event"
          test "$(git rev-parse refs/remotes/origin/ci-event)" = "$GITHUB_SHA"
          # Offline full-test preparation requires an attached exact source.
          # Create, never reset, a branch unique to this runner attempt.
          git switch --create "ci-event-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA"
          # Fail loudly on a partial (sparse or skip-worktree) checkout.
          test "$(git config --get --bool core.sparseCheckout || echo false)" = false
          skipped="$(git ls-files -t | grep -c '^S ' || true)"
          test "$skipped" = 0

      - name: Prepare pinned Lumen from the local seed
        shell: bash
        run: |
          # The runner token cannot fetch private jdotc1/Lumen; this Mac's Lumen
          # checkout holds every pin. Import the committed gitlink offline and
          # move any clean earlier checkout to it.
          python3 -B Scripts/dependencies/materialize_lumen_submodule.py \
            --source-root "$GITHUB_WORKSPACE" \
            --seed-repository "${MACSCOPE_LUMEN_SEED:-$(dirname "$MACSCOPE_WORK_ROOT")/Lumen}"

      - name: Record retained-product identity
        shell: bash
        run: |
          python3 -B Scripts/ci/retained_product_identity.py \
            --source-root "$GITHUB_WORKSPACE" \
            --work-root "$MACSCOPE_CI_QUALIFICATION_ROOT/$MACSCOPE_QUALIFICATION_WORK_ROOT_NAME"

      - name: Select affected validation
        id: convergence-scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B Scripts/ci/affected_selectors.py \
            --event "$GITHUB_EVENT_NAME" --base "${PR_BASE_SHA:-}" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          MACSCOPE_CI_SELECTION: ${{ steps.convergence-scope.outputs.qualify-arguments }}
        shell: bash
        run: |
          # One operator entrypoint binds source to the explicitly named GitHub
          # integration authority, reuses the shared offline cache, bootstraps
          # once and executes the certificate-backed test gate in the mode
          # selected above (smoke, focused-test or full-test). The live XPC
          # suites require the pinned designated requirements and must never
          # be reduced to an ad-hoc identity.
          ./Scripts/qualify_local_private_build.sh \
            --source-root "$GITHUB_WORKSPACE" \
            --work-root "$MACSCOPE_CI_QUALIFICATION_ROOT/$MACSCOPE_QUALIFICATION_WORK_ROOT_NAME" \
            --integration-ref refs/remotes/origin/ci-event \
            --integration-commit "$GITHUB_SHA" \
            --dependency-cache-root "$MACSCOPE_DEPENDENCY_CACHE_ROOT" \
            --pattern-adapter-root "$MACSCOPE_PATTERN_ADAPTER_ROOT" \
            --pattern-adapter-receipt "$MACSCOPE_PATTERN_ADAPTER_RECEIPT" \
            ${MACSCOPE_CI_SELECTION} \
            --release-candidate "$MACSCOPE_RELEASE_CANDIDATE" \
            --installed-ui-products "$MACSCOPE_INSTALLED_UI_PRODUCTS" \
            --persistent-run nightly \
            --compilation-cache \
            --gate-lock-shared \
            --nice 15 \
            --signing development > xcodebuild.log 2>&1 || { tail -400 xcodebuild.log; exit 1; }

      - name: Retain qualification timing identity
        if: always()
        shell: bash
        run: |
          python3 -B Scripts/ci/retained_product_identity.py \
            --source-root "$GITHUB_WORKSPACE" \
            --work-root "$MACSCOPE_CI_QUALIFICATION_ROOT/$MACSCOPE_QUALIFICATION_WORK_ROOT_NAME" \
            --finalize

      # The hosted lane deliberately excludes these macOS contract fixtures.
      # Runs after Build and test so a governance failure never hides the
      # native result. No application/XCTest build occurs here.
      - name: Run macOS Python governance suite
        if: always() && steps.convergence-scope.outputs.governance == 'true'
        shell: bash
        run: |
          # Reuse the recorded dependency/frontend identities on this runner.
          # A miss builds only the test frontend, never the SLEIGH library.
          CP1_SLEIGH_LIFT="$(/usr/bin/nice -n 15 Scripts/dependencies/build_cp1_sleigh_lift.sh \
            --out "$MACSCOPE_DEPENDENCY_CACHE_ROOT/cp1-sleigh-lift")"
          export CP1_SLEIGH_LIFT
          /usr/bin/nice -n 15 /usr/bin/python3 -B Scripts/ci/run_macos_governance.py

      - name: Native bridge sanitizers
        if: steps.convergence-scope.outputs.sanitizers == 'true'
        shell: bash
        run: |
          receipt=$(python3 -c \
            'import pathlib, sys; paths = list(pathlib.Path(sys.argv[1]).glob("runs/*/QUALIFICATION_INPUTS.json")); assert paths, "qualification receipt missing"; print(max(paths, key=lambda path: path.stat().st_mtime_ns))' \
            "$MACSCOPE_CI_QUALIFICATION_ROOT/$MACSCOPE_QUALIFICATION_WORK_ROOT_NAME")
          test -n "$receipt" && test -f "$receipt"
          sleigh_root=$(python3 -c \
            'import json, pathlib, sys; value = json.loads(pathlib.Path(sys.argv[1]).read_text()); root = pathlib.Path(value["sleigh_materialization_root"]).resolve(strict=True); print(root)' \
            "$receipt")
          # Qualification releases its lease before this separate native phase.
          # Hold one lease across both sanitizer builds and their test execution.
          gate_lock="$MACSCOPE_WORK_ROOT/.macscope-heavy-gate.lock"
          gate_helper="$GITHUB_WORKSPACE/Scripts/qualification/heavy_gate_lock.py"
          work_root="${MACSCOPE_CI_QUALIFICATION_ROOT}/${MACSCOPE_QUALIFICATION_WORK_ROOT_NAME}"
          mkdir -p "$(dirname "$gate_lock")"
          test ! -L "$gate_lock"
          exec 7>>"$gate_lock"
          # A shared dev-loop slot, never the exclusive lock (D12).
          for slot in 0 1 2; do test ! -L "$gate_lock.slot-$slot"; done
          exec 4>>"$gate_lock.slot-0" 5>>"$gate_lock.slot-1" 6>>"$gate_lock.slot-2"
          renice 15 -p $$ >/dev/null
          release_sanitizer_lock() {
            python3 -B "$gate_helper" release --lock "$gate_lock" --pid "$$" || true
            exec 7>&- 4>&- 5>&- 6>&-
          }
          trap release_sanitizer_lock EXIT
          python3 -B "$gate_helper" acquire --fd 7 --lock "$gate_lock" \
            --pid "$$" --work-root "$work_root" \
            --integration-ref refs/remotes/origin/ci-event \
            --mode native-sanitizers --run-root "$(dirname "$receipt")" \
            --shared --slot-fds 4,5,6
          ./Scripts/native-decompiler-xpc/run_native_bridge_sanitizers.sh \
            --source-root "$GITHUB_WORKSPACE/Tools/NativeDecompilerBridge" \
            --build-root "$RUNNER_TEMP/macscope-native-sanitizers" \
            --materialization-root "$sleigh_root" \
            --sanitizer address
          ./Scripts/native-decompiler-xpc/run_native_bridge_sanitizers.sh \
            --source-root "$GITHUB_WORKSPACE/Tools/NativeDecompilerBridge" \
            --build-root "$RUNNER_TEMP/macscope-native-sanitizers" \
            --materialization-root "$sleigh_root" \
            --sanitizer undefined

      - name: Retain explicit uncovered window-test scope
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nonwindow-test-scope
          path: ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/NONWINDOW_TEST_SCOPE.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/TEST_SELECTION.txt
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/CI_RETENTION.json
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/TestResults.xcresult
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/COVERAGE.json
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/NONWINDOW_TEST_SCOPE.json
            ${{ env.MACSCOPE_CI_QUALIFICATION_ROOT }}/${{ env.MACSCOPE_QUALIFICATION_WORK_ROOT_NAME }}/runs/**/QUALIFICATION_INPUTS.json
          retention-days: 1
